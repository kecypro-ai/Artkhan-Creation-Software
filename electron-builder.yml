appId: com.artkhan.atelier
productName: Atelier
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
